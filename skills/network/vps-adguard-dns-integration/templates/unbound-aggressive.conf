# Unbound aggressive caching config
# Install: apt-get install -y unbound
# Place at: /etc/unbound/unbound.conf.d/aggressive.conf
# Then: systemctl restart unbound
#
# IMPORTANT: Do NOT add auto-trust-anchor-file if the system
# already has /etc/unbound/unbound.conf.d/root-auto-trust-anchor-file.conf
# - it will cause "trust anchor presented twice" error.

server:
    interface: 127.0.0.1
    port: 5353

    # IP protocol
    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes

    # DNSSEC validation logging level
    val-log-level: 2

    # Aggressive caching
    cache-min-ttl: 3600        # Minimum TTL 1h
    cache-max-ttl: 86400       # Maximum TTL 24h
    msg-cache-size: 128m       # 128MB message cache
    rrset-cache-size: 256m     # 256MB RRset cache
    prefetch: yes              # Refresh before TTL expires
    prefetch-key: yes          # Prefetch DNSSEC keys too
    serve-expired: yes         # Serve stale while refreshing
    serve-expired-ttl: 86400   # Keep stale up to 24h

    # Performance tuning
    num-threads: 2
    so-rcvbuf: 4m
    so-sndbuf: 4m
    infra-cache-numhosts: 10000

    # Privacy
    hide-identity: yes
    hide-version: yes

    # Root hints (must exist)
    root-hints: /var/lib/unbound/root.hints
    # Download: wget -O /var/lib/unbound/root.hints https://www.internic.net/domain/named.cache

    # Access control — only localhost
    access-control: 127.0.0.0/8 allow
    access-control: ::1/128 allow

    # Aggressive NSEC (proof of non-existence caching)
    aggressive-nsec: yes

    # QNAME minimisation (privacy improvement)
    qname-minimisation: yes
