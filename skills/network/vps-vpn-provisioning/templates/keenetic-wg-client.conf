# WireGuard client (Keenetic) — /root/keenetic-wg0.conf
# Подставить: PrivateKey = <client.key>, PublicKey = <server.pub>
# Импорт в Keenetic: Другие подключения → WireGuard → «из файла»
# Сохранять: VPS /root/ + копия в WSL /root/, chmod 600 у обеих

[Interface]
PrivateKey = <CLIENT_PRIVATE_KEY>
Address = 10.7.0.2/24
DNS = 45.134.15.185
MTU = 1420

[Peer]
PublicKey = <SERVER_PUBLIC_KEY>
Endpoint = 5.39.255.242:51871
AllowedIPs = 0.0.0.0/0
PersistentKeepalive = 25

# DNS = 45.134.15.185 — AdGuardHome+unbound пользователя (проверить *:53 и внешний
# резолв ДО выдачи конфига). Полный туннель: вся домашняя сеть через VPS.
# После подключения роутера проверить на сервере: wg show wg0 → latest handshake.
