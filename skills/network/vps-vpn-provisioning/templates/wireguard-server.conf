# WireGuard server — /etc/wireguard/wg0.conf
# Подставить: PrivateKey = <server.key>, PublicKey peer = <client.pub>
# Выходной интерфейс ens18 (проверить: cat /proc/net/route)
# Подсеть и порт согласовать с пользователем (порт нестандартный, не 443)

[Interface]
Address = 10.7.0.1/24
ListenPort = 51871
PrivateKey = <SERVER_PRIVATE_KEY>
MTU = 1420

PostUp = iptables -A FORWARD -i wg0 -o ens18 -j ACCEPT
PostUp = iptables -A FORWARD -i ens18 -o wg0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
PostUp = iptables -t nat -A POSTROUTING -o ens18 -j MASQUERADE
PostDown = iptables -D FORWARD -i wg0 -o ens18 -j ACCEPT
PostDown = iptables -D FORWARD -i ens18 -o wg0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
PostDown = iptables -t nat -D POSTROUTING -o ens18 -j MASQUERADE

[Peer]
# Keenetic (домашний роутер) — полный туннель
PublicKey = <CLIENT_PUBLIC_KEY>
AllowedIPs = 10.7.0.2/32
PersistentKeepalive = 25

# --- Установка ---
# apt-get install -y wireguard; modprobe wireguard
# umask 077; cd /etc/wireguard; wg genkey > server.key; wg pubkey < server.key > server.pub
# wg genkey > keenetic.key; wg pubkey < keenetic.key > keenetic.pub; chmod 600 *.key
# echo "net.ipv4.ip_forward=1" > /etc/sysctl.d/99-wireguard.conf && sysctl -p /etc/sysctl.d/99-wireguard.conf
# chmod 600 /etc/wireguard/wg0.conf
# systemctl enable --now wg-quick@wg0   (НЕ wg-quick up вручную — systemd не отслеживает)
# Проверка: wg show; timeout 8 bash -c 'echo t > /dev/udp/IP/PORT'
